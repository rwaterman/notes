name: Deploy notes

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.env || github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the created-modified-date Quartz plugin derives each note's
          # dates from git history instead of stamping the checkout time on every page.
          fetch-depth: 0

      - name: Resolve environment
        id: target
        env:
          REQUESTED_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$REQUESTED_ENV" ]; then
            TARGET_ENV="$REQUESTED_ENV"
          elif [ "$REF_NAME" = "main" ]; then
            TARGET_ENV="prod"
          else
            TARGET_ENV="dev"
          fi

          case "$TARGET_ENV" in
            prod)
              echo "name=prod" >> "$GITHUB_OUTPUT"
              echo "host=notes.rickgwaterman.com" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "name=dev" >> "$GITHUB_OUTPUT"
              echo "host=notes-dev.rickgwaterman.com" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported environment: $TARGET_ENV" >&2
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v6
        with:
          node-version-file: quartz/.node-version
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      # Quartz v5 fetches its github:quartz-community/* plugins via git at install time;
      # cache them (keyed on the lockfile) so deploys don't re-clone ~46 repos each run.
      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: quartz/.quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz/quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-plugins-

      - name: Build site
        working-directory: quartz
        env:
          SITE_HOST: ${{ steps.target.outputs.host }}
        run: |
          npm ci
          npx quartz plugin install
          yq -i ".configuration.baseUrl = \"$SITE_HOST\"" quartz.config.yaml
          npx quartz build

      # Quartz emits sitemap.xml but no robots.txt: block crawlers on dev, allow on prod.
      - name: Write robots.txt
        env:
          SITE_HOST: ${{ steps.target.outputs.host }}
          TARGET_NAME: ${{ steps.target.outputs.name }}
        run: |
          if [ "$TARGET_NAME" = "dev" ]; then
            printf 'User-agent: *\nDisallow: /\n' > quartz/public/robots.txt
          else
            printf 'User-agent: *\nAllow: /\n\nSitemap: https://%s/sitemap.xml\n' "$SITE_HOST" > quartz/public/robots.txt
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/notes-content-${{ steps.target.outputs.name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy targets
        id: targets
        run: |
          BUCKET=$(aws ssm get-parameter --name "/notes/${{ steps.target.outputs.name }}/bucket-name" --query Parameter.Value --output text)
          DIST=$(aws ssm get-parameter --name "/notes/${{ steps.target.outputs.name }}/distribution-id" --query Parameter.Value --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: |
          # Quartz emits some content-hashed assets (component-*.css, static/resource-*)
          # but also stable-named ones that change every build (index.css, *script.js),
          # so everything is uploaded must-revalidate and the CloudFront invalidation
          # below guarantees a full refresh.
          aws s3 sync quartz/public/ "s3://${{ steps.targets.outputs.bucket }}" --delete \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.targets.outputs.distribution }}" \
            --paths "/*"
