version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/infra"
      - "/quartz"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # @quartz-community/utils wants preact ^10 as a peer; a major bump breaks the build.
      - dependency-name: preact
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/quartz"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
